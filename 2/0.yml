---
# 2/0.yml - Дочерний плейбук с выводом переменных в консоль
- name: Демонстрация переменных из родительского плейбука
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    const: "{{ scope | default({}) }}"
    desired_state: "{{ desired_state | default('present') }}"
  
  tasks:
    - name: Вывод информационного заголовка
      debug:
        msg: "====== НАЧАЛО ВЫПОЛНЕНИЯ ПЛЕЙБУКА 2/0.yml ======"
        
    - name: Вывод режима работы плейбука
      debug:
        msg: "Текущий режим работы плейбука: {{ desired_state }}"
      
    - name: Вывод пути к файлу конфигурации
      debug:
        msg: "Используемый файл конфигурации: {{ parent_vars.config_file | default('ci.yml (по умолчанию)') }}"
    
    # Эта задача предполагает, что в ci.yml или cd.yml есть переменная application_name
    # Если её нет, плейбук всё равно выполнится благодаря фильтру default    
    - name: Вывод данных из файла конфигурации
      debug:
        msg: "Имя приложения из конфигурации: {{ parent_vars.application_name | default('Имя приложения не определено') }}"
    
    - name: Вывод всех доступных переменных родительского плейбука
      debug:
        var: parent_vars
        verbosity: 1  # Будет выведено только при запуске с -v или более высоким уровнем вербозности
    
    - name: Вывод заключительного сообщения
      debug:
        msg: "====== ЗАВЕРШЕНИЕ ВЫПОЛНЕНИЯ ПЛЕЙБУКА 2/0.yml ======="
