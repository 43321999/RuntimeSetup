name: Trigger RuntimeSetup Workflow

on:
  workflow_dispatch:  # или другой триггер (push, schedule и т.д.)

permissions:
  actions: write
  contents: read

jobs:
  trigger-external-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Manual Test Workflow
        run: |
         gh api repos/43321999/RuntimeSetup/actions/workflows/manual-test.yml/dispatches \
          -f ref=bd-setup-test-github-action-dont-forget-delete-after \
          -f inputs='{"environment":"dev","debug_mode":"true"}'
            # gh workflow run manual-test.yml \
            # --repo 43321999/RuntimeSetup \
            # --ref bd-setup-test-github-action-dont-forget-delet-after \
            # --ref bd-setup-test-github-action-dont-forget-delet-after \
            # -f environment=dev \
            # -f debug_mode=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
